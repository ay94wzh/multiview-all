# Evaluation config
eval:
  # relative to the CWD you run scripts/eval.py from (policy_robosuite/);
  # running from the repo root also works — scripts/_argpath.py falls back to
  # policy_robosuite/ when a config/checkpoint path is not found under CWD
  checkpoint: checkpoints_baseline/epoch-10.pt
  num_episodes: 50
  use_teacher: false   # false = student (single held-out front camera), the deployed path
  render: false
  # 50 DDIM steps: near-deterministic sampling (10 steps loses a lot of
  # fidelity at the fragile grasp — measured 0.0 vs 1.0 on a memorized seed).
  inference_steps: 50
