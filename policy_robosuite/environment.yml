# Fresh-machine env for policy_robosuite (no know_your_camera needed).
# Tested versions (the working local env): python 3.10.20, torch 2.11.0+cu128,
# numpy 2.2.6, robosuite 1.5.2, mujoco 3.9.0, h5py 3.16, wandb 0.28.
#
#   conda env create -f environment.yml
#   conda run -n multiview-robosuite pip install ./policy_robosuite
#   conda run -n multiview-robosuite python -c "import robosuite, policy_robosuite"
#
# Notes:
#   * torch comes from the pytorch conda channel (CUDA 12.8 build). If the new
#     machine's driver is older, lower pytorch-cuda (e.g. 12.1).
#   * "mujoco<3.10" is load-bearing: robosuite's setup.py caps it (mj_fullM's
#     signature changed in 3.10) and the pip section enforces the cap against
#     whatever robosuite would otherwise pull.
#   * robosuite imports warn about robosuite_models / mink — harmless, we use
#     the built-in Panda.
#   * Headless rendering needs EGL on the machine: on Ubuntu,
#     `sudo apt install libegl1 libgl1` (mujoco's pip wheels bundle the rest).
name: multiview-robosuite
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pytorch
  - torchvision
  - pytorch-cuda=12.8
  - pip
  - pip:
      - "mujoco<3.10"
      - robosuite==1.5.2
      - numpy
      - pyyaml
      - einops
      - opencv-python-headless
      - h5py
      - wandb
      - pytest
      - tqdm
